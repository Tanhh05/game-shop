#    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}

minio:
  url: ${MINIO_URL:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:product-images}
  public-url: ${MINIO_PUBLIC_URL:}
